<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Appsbender</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            font-family: "Montserrat", sans-serif;
            font-optical-sizing: auto;
            background-color: #8f6bd1;
            background-image: linear-gradient(to right top, #8f6bd1, #8770d9, #7d75e2, #717be9, #6380f1, #4990f9, #2a9efd, #00abff, #00c2ff, #00d7ff, #00eafa, #5ffbf1);
            font-size: 15px;
        }

        .main-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .main-wrapper>.content {
            text-align: center;
            color: #fff;
            max-width: 500px;
            padding: .6rem 2.8rem;
        }

        .floating-logo {
            max-width: 120px;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 10px 20px rgba(255, 255, 255, 0.15));
        }

        /* Floating Animation */
        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-12px);
            }

            100% {
                transform: translateY(0px);
            }
        }
    </style>

</head>

<body>
    <div class="main-wrapper">
        <section class="content">
            <img src="mono-logo.svg"  class="floating-logo" style="max-width: 120px;" />
            <p>I'm currently working on improving my website to provide you with a better experience. Check back soon
                for updates!
                <br /><br />
                If you need to get in touch, you can reach me via email at:
                <span style="text-decoration: underline;">regz24@gmail.com</span>
                <br /><br />
                Thank you for your patience and support.
            </p>
        </section>
    </div>
</body>

</html>
